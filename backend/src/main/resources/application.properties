spring.application.name=backend

# Datasource configuration (override via environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/film_buff}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ritvik@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.open-in-view=true

# File upload limits for CSV/ZIP data imports
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Signing Secret (loaded from environment variable JWT_SECRET)
jwt.secret=${JWT_SECRET:}

# TMDB API (loaded from environment variable TMDB_API_TOKEN)
tmdb.api.token=${TMDB_API_TOKEN:}
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}

# Server port (Render sets dynamic PORT; defaults to 8080)
server.port=${PORT:8080}
server.address=0.0.0.0
