<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CD9E"/>
      <stop offset="100%" stop-color="#C9A86A"/>
    </linearGradient>
  </defs>

  <!-- Midnight Cinema Dark Background -->
  <rect width="64" height="64" rx="14" fill="#0B0C10"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#C9A86A" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Cinephile 'C' Wordmark Glyph -->
  <text 
    x="32" 
    y="34" 
    font-family="'Georgia', 'Fraunces', 'Times New Roman', serif" 
    font-size="44" 
    font-weight="700" 
    fill="url(#goldGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
  >C</text>
</svg>